<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bite Your Tail</title>
<style>
  /* Layout: one screen, never scrolls. The game canvas is letterboxed in a frame that keeps a side gutter.
     One look, dark: a neon arena. Every colour and typeface the page itself uses is a token here. */
  :root { --bg: #070b18; --panel: #141c3d; --text: #e8f0ff; --dim: #8fa3c7; --mint: #5effc3; --gold: #ffd166; --ink: #0b1020;
          --veil: rgba(5, 8, 20, 0.8); --panel-clear: rgba(20, 28, 61, 0); --panel-solid: rgba(20, 28, 61, 0.9);
          --line: rgba(143, 163, 199, 0.5); --cell: rgba(255, 255, 255, 0.05); --cell-won: rgba(255, 209, 102, 0.13);
          --font-ui: Oxanium, "Trebuchet MS", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
          color-scheme: dark; }
  html { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden; overscroll-behavior: none; }
  /* The frame keeps a side gutter clear of phone system bars; the stage inside it is what the game measures. */
  #frame { box-sizing: border-box; height: 100%;
           padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #stage { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
           touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; outline: none; cursor: crosshair; }
  /* Menus sit above the touch controls and take the game's colours. */
  body .gui { z-index: 1500; font-family: var(--font-ui); font-weight: 600; --gui-bg: var(--veil); --gui-panel: var(--panel); --gui-text: var(--text); --gui-dim: var(--dim);
              --gui-accent: var(--mint); --gui-accent-text: var(--ink); --gui-focus: var(--gold); }
  /* Mutation cards: a name and one line of what it does. Colours follow the button, so a focused card stays readable. */
  body .gui .card { display: flex; flex-direction: column; gap: 0.2em; text-align: left; padding: 0.55em 1em; box-sizing: border-box; min-width: 0; }
  body .gui .card b { font-weight: 800; letter-spacing: 0.04em; color: var(--gold); }
  body .gui .card span { font-size: 0.8em; font-weight: 600; color: var(--text); }
  body .gui .card:focus-visible b, body .gui .card:focus-visible span { color: inherit; }
  /* The pause menu: in a wide window its buttons go two abreast under Resume, so all five fit a short screen. */
  body .gui:not(.tall) .two-col .gui-list { display: grid; grid-template-columns: 1fr 1fr; }
  body .gui:not(.tall) .two-col .gui-list > :first-child { grid-column: 1 / -1; }
  body .gui .note { max-width: 26em; margin: 0 auto 0.9em; font-size: 0.78em; color: var(--gold); }
  /* The Menu button on the title screen, and the two screens that are for reading. */
  body .gui .title-menu { position: absolute; top: 0.6em; right: 0.6em; pointer-events: auto; font-size: 0.85em; padding: 0.35em 1.1em; background: var(--panel-solid); border-color: var(--line); color: var(--text); }
  body .gui .wide .gui-panel { width: min(41em, 92%); box-sizing: border-box; padding: 0.9em 1.3em 1em; }
  body .gui .wide h2 { font-size: 1.45em; margin-bottom: 0.45em; }
  /* Back stays in reach however long the page above it: the text scrolls away under it. */
  body .gui .wide .gui-list { position: sticky; bottom: -1em; margin-bottom: -1em; padding: 0.7em 0 1em; background: linear-gradient(var(--panel-clear), var(--panel) 35%); }
  body .gui .help, body .gui .records { text-align: left; font-size: max(0.74em, 11px); font-weight: 600; line-height: 1.35; margin-bottom: 0.2em; color: var(--text); }
  body .gui .help ul { margin: 0 0 0.7em; padding-left: 1.2em; }
  body .gui .help li { margin: 0.15em 0; }
  body .gui .beasts { display: grid; grid-template-columns: 2.2em 1fr; gap: 0.15em 0.7em; align-items: center; }
  body .gui .beasts canvas { width: 2.2em; height: 2.2em; }
  body .gui .beasts b { color: var(--gold); letter-spacing: 0.04em; margin-right: 0.6em; }
  body .gui .records h3 { margin: 0.2em 0 0.4em; font-size: 0.95em; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
  body .gui .records p { margin: 0 0 0.9em; text-align: left; }
  body .gui .runs { margin: 0 0 0.9em; padding-left: 1.6em; font-variant-numeric: tabular-nums; }
  body .gui .runs b { display: inline-block; min-width: 5em; }
  body .gui .runs span { color: var(--dim); }
  body .gui .medals { display: grid; grid-template-columns: repeat(auto-fill, minmax(11.5em, 1fr)); gap: 0.4em 0.6em; }
  body .gui .medal { display: flex; flex-direction: column; padding: 0.3em 0.6em; border-radius: 0.4em; background: var(--cell); color: var(--dim); }
  body .gui .medal b { letter-spacing: 0.04em; }
  body .gui .medal.got { background: var(--cell-won); color: var(--text); }
  body .gui .medal.got b { color: var(--gold); }
</style>

<style>
/* ui.css - styles for ui.js. Sizes are in em: the layer's font-size follows the canvas
   height, so the whole UI scales with the game. Recolour with the custom properties. */
.gui {
  --gui-bg: rgba(12, 14, 26, 0.86); --gui-panel: #1f2335; --gui-text: #f4f4f4; --gui-dim: #a9b1d6;
  --gui-accent: #73eff7; --gui-accent-text: #10121c; --gui-focus: #ffcd75;
  position: fixed; z-index: 500; pointer-events: none; overflow: hidden;
  color: var(--gui-text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.3;
  -webkit-user-select: none; user-select: none;
}
.gui [hidden] { display: none !important; }

/* HUD: never blocks input, readable over any background */
.gui-hud { position: absolute; inset: 0; }
.gui-field { position: absolute; font-weight: 700; font-size: 1.15em; font-variant-numeric: tabular-nums;
  text-shadow: 0 0.08em 0 #000, 0 0 0.3em rgba(0, 0, 0, 0.8);
  padding: calc(0.5em + env(safe-area-inset-top)) calc(0.7em + env(safe-area-inset-right)) calc(0.5em + env(safe-area-inset-bottom)) calc(0.7em + env(safe-area-inset-left)); }
.gui-top-left { left: 0; top: 0; } .gui-top-right { right: 0; top: 0; text-align: right; }
.gui-top-center { left: 50%; top: 0; transform: translateX(-50%); }
.gui-bottom-left { left: 0; bottom: 0; } .gui-bottom-right { right: 0; bottom: 0; text-align: right; }

/* Screens */
.gui-screens { position: absolute; inset: 0; }
.gui-open .gui-screens { pointer-events: auto; background: var(--gui-bg); }
.gui-screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 1em; }
.gui-panel { min-width: min(16em, 90%); max-width: 92%; max-height: 96%; overflow: auto; text-align: center;
  background: var(--gui-panel); border-radius: 0.6em; padding: 1.2em 1.4em; box-shadow: 0 0.4em 1.6em rgba(0, 0, 0, 0.5); }
.gui-panel h2 { margin: 0 0 0.6em; font-size: 1.9em; letter-spacing: 0.02em; }
.gui-panel p { margin: 0 0 1em; color: var(--gui-dim); }
.gui-list { display: flex; flex-direction: column; gap: 0.55em; }

.gui-btn { font: inherit; font-weight: 700; font-size: 1.1em; color: var(--gui-text); cursor: pointer;
  min-height: 44px; padding: 0.55em 1.2em; border-radius: 0.45em; border: 2px solid transparent; background: rgba(255, 255, 255, 0.1);
  transition: transform 0.08s, background 0.12s; touch-action: manipulation; }
.gui-btn:hover { background: rgba(255, 255, 255, 0.18); }
.gui-btn:active { transform: scale(0.97); }
.gui-btn:focus-visible, .gui-row:focus-within { outline: none; border-color: var(--gui-focus); background: var(--gui-accent); color: var(--gui-accent-text); }

.gui-row { display: flex; align-items: center; justify-content: space-between; gap: 1.2em; text-align: left;
  min-height: 44px; padding: 0.3em 0.8em; border-radius: 0.45em; border: 2px solid transparent; background: rgba(255, 255, 255, 0.06); }
.gui-row input[type="range"] { width: 9em; accent-color: var(--gui-accent); }
.gui-row input[type="checkbox"] { width: 1.5em; height: 1.5em; accent-color: var(--gui-accent); }
.gui-row select { font: inherit; padding: 0.2em 0.4em; }
.gui-row:focus-within input { accent-color: var(--gui-accent-text); }   /* a focused row is accent-coloured: keep its control readable */

/* Toasts */
.gui-toasts { position: absolute; left: 0; right: 0; top: 13%; display: flex; flex-direction: column; align-items: center; gap: 0.4em; }
.gui-toast { background: rgba(0, 0, 0, 0.78); padding: 0.45em 1em; border-radius: 2em; font-weight: 600; transition: opacity 0.35s, transform 0.35s; }
.gui-toast.gui-out { opacity: 0; transform: translateY(0.6em); }

/* Accessibility switches (ui.prefs) and system requests */
.gui-high-contrast { --gui-bg: #000; --gui-panel: #000; --gui-text: #fff; --gui-dim: #fff; --gui-accent: #ff0; --gui-accent-text: #000; --gui-focus: #fff; }
.gui-high-contrast .gui-panel, .gui-high-contrast .gui-btn, .gui-high-contrast .gui-row { border: 2px solid #fff; }
/* .gui-large-text is applied in ui.js (fit): it scales the layer's font size by 1.3 */
@media (prefers-reduced-motion: reduce) { .gui-btn, .gui-toast { transition: none; } }

</style>
